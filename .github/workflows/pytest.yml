name: Pytest

on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: tlambert03/setup-qt-libs@v1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies for tests
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install flake8 mypy pytest-xvfb types-requests

      - name: Install XVFB for gui testing
        run: |
          sudo apt-get install xvfb

      - name: Run linter
        run: |
          flake8 blackboard_sync/qt
          flake8 blackboard_sync/content

      - name: Run type checker
        run: |
          python -m mypy --install-types --non-interactive blackboard_sync/qt
          mypy --strict blackboard_sync/qt

      - name: Run test suite
        env:
          # QtWebEngine (Chromium) segfaults on teardown under headless CI
          # unless the sandbox and GPU are disabled.
          QTWEBENGINE_DISABLE_SANDBOX: "1"
          QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu --disable-software-rasterizer --disable-dev-shm-usage"
        run: pytest -vvvv
