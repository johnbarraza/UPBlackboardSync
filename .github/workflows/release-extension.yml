name: Release Extension

on:
  workflow_call:
    inputs:
      tag_name:
        description: "Tag for the release (optional; if empty auto-generates next ext-vX.Y.Z)"
        required: false
        default: ""
        type: string
  push:
    tags:
      - "ext-v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag for the release (optional; if empty auto-generates next ext-vX.Y.Z)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve tag name
        id: vars
        run: |
          TAG=""
          if [ "${{ github.event_name }}" = "workflow_call" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [ -z "$TAG" ]; then
            latest="$(git tag -l --sort=-v:refname "ext-v*" | grep -E '^ext-v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
            if [ -z "$latest" ]; then
              TAG="ext-v0.1.0"
            else
              clean="${latest#ext-v}"
              IFS='.' read -r major minor patch <<< "$clean"
              major="${major:-0}"
              minor="${minor:-1}"
              patch="${patch:-0}"
              patch=$((patch + 1))
              TAG="ext-v${major}.${minor}.${patch}"
            fi
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Validate tag prefix
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          case "$TAG" in
            ext-v*) ;;
            *) echo "Tag must start with ext-v"; exit 1 ;;
          esac

      - name: Set manifest version from tag
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          tag = "${{ steps.vars.outputs.tag }}"
          version = tag.removeprefix("ext-v")
          path = Path("extension/manifest.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          manifest["version"] = version
          path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(f"manifest version set to {version}")
          PY

      - name: Package Chrome zip and Firefox xpi
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          VERSION="${TAG#ext-v}"
          cd extension
          zip -r "../blackboardsync-extension-chrome-${VERSION}.zip" .
          zip -r "../blackboardsync-extension-firefox-${VERSION}.xpi" .

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: BlackboardSync Extension ${{ steps.vars.outputs.tag }}
          generate_release_notes: true
          files: |
            blackboardsync-extension-chrome-*.zip
            blackboardsync-extension-firefox-*.xpi
