name: Release Desktop

on:
  workflow_call:
    inputs:
      tag_name:
        description: "Release tag (example: v1.0.0 or 1.0.0)"
        required: false
        default: ""
        type: string
      target:
        description: "Desktop target to build"
        required: false
        default: "windows"
        type: string
      prerelease:
        description: "Mark GitHub release as pre-release"
        required: false
        default: false
        type: boolean
    outputs:
      resolved_tag:
        description: "Resolved release tag"
        value: ${{ jobs.prepare.outputs.tag }}
      resolved_version:
        description: "Resolved release version"
        value: ${{ jobs.prepare.outputs.version }}
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (optional; if empty auto-generates next vX.Y.Z)"
        required: false
        default: ""
        type: string
      target:
        description: "Desktop target to build"
        required: true
        default: windows
        type: choice
        options:
          - windows
          - mac
          - both
      prerelease:
        description: "Mark GitHub release as pre-release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  PYTHON_VER: "3.11.9"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      target: ${{ steps.meta.outputs.target }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve inputs
        id: meta
        shell: bash
        run: |
          TAG="${{ inputs.tag_name }}"
          TARGET="${{ inputs.target }}"

          if [ -z "$TAG" ]; then
            latest="$(git tag -l --sort=-v:refname "v*" | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
            if [ -z "$latest" ]; then
              TAG="v0.1.0"
            else
              clean="${latest#v}"
              IFS='.' read -r major minor patch <<< "$clean"
              major="${major:-0}"
              minor="${minor:-1}"
              patch="${patch:-0}"
              patch=$((patch + 1))
              TAG="v${major}.${minor}.${patch}"
            fi
          fi

          case "$TARGET" in
            windows|mac|both) ;;
            *)
              echo "Invalid target: $TARGET"
              exit 1
              ;;
          esac

          VERSION="${TAG#v}"
          if [ -z "$VERSION" ]; then
            echo "Could not derive version from tag $TAG"
            exit 1
          fi

          if [ "${{ inputs.prerelease }}" = "true" ]; then
            PRE="true"
          elif [[ "$TAG" == *-* ]]; then
            PRE="true"
          else
            PRE="false"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"

  build-windows:
    if: ${{ needs.prepare.outputs.target == 'windows' || needs.prepare.outputs.target == 'both' }}
    needs: [prepare]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VER }}

      - name: Install dependencies from Pipfile
        shell: bash
        run: |
          python -m pip install --upgrade pip pipenv
          pipenv requirements --dev > requirements.txt
          pip install -r requirements.txt
          pip install jinja2 GitPython packaging setuptools-scm

      - name: Build app with PyInstaller
        run: pyinstaller BlackboardSync.spec --noconfirm --clean

      - name: Render packaging templates
        run: python packaging/replace.py $env:VERSION

      - name: Copy packaging assets
        run: |
          Copy-Item LICENSE replaced -Force
          Copy-Item packaging\windows\*.ico replaced -Force
          Copy-Item packaging\windows\*.png replaced -Force

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Build installer (.exe)
        run: makensis /V3 /DVERSION=$env:VERSION replaced\pkg_win.nsi

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: dist/*.exe

  build-macos:
    if: ${{ needs.prepare.outputs.target == 'mac' || needs.prepare.outputs.target == 'both' }}
    needs: [prepare]
    runs-on: macos-14
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VER }}

      - name: Install dependencies from Pipfile
        shell: bash
        run: |
          python -m pip install --upgrade pip pipenv
          pipenv requirements --dev > requirements.txt
          pip install -r requirements.txt
          pip install setuptools-scm

      - name: Build app with PyInstaller
        run: pyinstaller BlackboardSync.spec --noconfirm --clean

      - name: Package DMG (unsigned)
        shell: bash
        run: |
          APP_PATH="$(ls -d dist/*.app | head -n1)"
          APP_NAME="$(basename "$APP_PATH" .app)"
          mkdir -p dist/bbsync_dmg
          ln -s /Applications dist/bbsync_dmg/Applications
          cp -R "$APP_PATH" dist/bbsync_dmg/
          hdiutil create -volname "$APP_NAME" -srcfolder dist/bbsync_dmg -ov -format UDZO "dist/${APP_NAME}-${VERSION}-arm64.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: dist/*.dmg

  release:
    needs: [prepare, build-windows, build-macos]
    if: ${{ always() && (needs.build-windows.result == 'success' || needs.build-macos.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: BlackboardSync ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          files: |
            ./*.exe
            ./*.dmg
