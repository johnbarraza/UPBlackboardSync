name: Release Desktop

on:
  workflow_call:
    inputs:
      tag_name:
        description: "Release tag (example: v1.0.0 or 1.0.0)"
        required: false
        default: ""
        type: string
      target:
        description: "Desktop target to build"
        required: false
        default: "windows"
        type: string
      prerelease:
        description: "Mark GitHub release as pre-release"
        required: false
        default: false
        type: boolean
    outputs:
      resolved_tag:
        description: "Resolved release tag"
        value: ${{ jobs.prepare.outputs.tag }}
      resolved_version:
        description: "Resolved release version"
        value: ${{ jobs.prepare.outputs.version }}
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (optional; if empty auto-generates next vX.Y.Z)"
        required: false
        default: ""
        type: string
      target:
        description: "Desktop target to build"
        required: true
        default: windows
        type: choice
        options:
          - windows
          - mac
          - linux
          - both
          - all
      prerelease:
        description: "Mark GitHub release as pre-release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  PYTHON_VER: "3.11.9"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      target: ${{ steps.meta.outputs.target }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve inputs
        id: meta
        shell: bash
        run: |
          TAG="${{ inputs.tag_name }}"
          TARGET="${{ inputs.target }}"

          if [ -z "$TAG" ]; then
            latest="$(git tag -l --sort=-v:refname "v*" | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
            if [ -z "$latest" ]; then
              TAG="v0.1.0"
            else
              clean="${latest#v}"
              IFS='.' read -r major minor patch <<< "$clean"
              major="${major:-0}"
              minor="${minor:-1}"
              patch="${patch:-0}"
              patch=$((patch + 1))
              TAG="v${major}.${minor}.${patch}"
            fi
          fi

          case "$TARGET" in
            windows|mac|linux|both|all) ;;
            *)
              echo "Invalid target: $TARGET"
              exit 1
              ;;
          esac

          VERSION="${TAG#v}"
          if [ -z "$VERSION" ]; then
            echo "Could not derive version from tag $TAG"
            exit 1
          fi

          if [ "${{ inputs.prerelease }}" = "true" ]; then
            PRE="true"
          elif [[ "$TAG" == *-* ]]; then
            PRE="true"
          else
            PRE="false"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"

  build-windows:
    if: ${{ needs.prepare.outputs.target == 'windows' || needs.prepare.outputs.target == 'both' || needs.prepare.outputs.target == 'all' }}
    needs: [prepare]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VER }}

      - name: Install dependencies from Pipfile
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[package]"
          pip install jinja2 GitPython packaging setuptools-scm

      - name: Build app with PyInstaller
        run: pyinstaller BlackboardSync.spec --noconfirm --clean

      - name: Render packaging templates
        run: python packaging/replace.py $env:VERSION

      - name: Copy packaging assets
        run: |
          Copy-Item LICENSE replaced -Force
          Copy-Item packaging\windows\*.ico replaced -Force
          Copy-Item packaging\windows\*.png replaced -Force

      - name: Install NSIS
        shell: powershell
        run: |
          choco install nsis --yes --no-progress --limit-output

          $chocoProfile = Join-Path $env:ChocolateyInstall "helpers\chocolateyProfile.psm1"
          if (Test-Path $chocoProfile) {
            Import-Module $chocoProfile
            refreshenv
          }

          $cmd = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if (-not $cmd) {
            Write-Host "NSIS not found after nsis install, trying nsis.portable..."
            choco install nsis.portable --yes --no-progress --limit-output
            if (Test-Path $chocoProfile) {
              Import-Module $chocoProfile
              refreshenv
            }
          }

      - name: Build installer (.exe)
        shell: powershell
        run: |
          $candidates = New-Object System.Collections.Generic.List[string]

          $cmd = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if ($cmd -and $cmd.Source) {
            $candidates.Add($cmd.Source)
          }

          @(
            "$env:ProgramFiles(x86)\NSIS\makensis.exe",
            "$env:ProgramFiles\NSIS\makensis.exe",
            "C:\ProgramData\chocolatey\bin\makensis.exe"
          ) | ForEach-Object { $candidates.Add($_) }

          $chocoLibHits = Get-ChildItem "C:\ProgramData\chocolatey\lib" -Filter makensis.exe -Recurse -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName
          foreach ($hit in $chocoLibHits) {
            $candidates.Add($hit)
          }

          $makensis = $null
          $uniqueCandidates = $candidates | Where-Object { $_ } | Select-Object -Unique
          Write-Host "makensis candidates:"
          $uniqueCandidates | ForEach-Object { Write-Host " - $_" }

          foreach ($candidate in $uniqueCandidates) {
            if (Test-Path $candidate) {
              $makensis = $candidate
              break
            }
          }

          if (-not $makensis) {
            Write-Host "Unable to locate makensis.exe from installed locations, downloading portable NSIS..."
            $portableUrl = "https://sourceforge.net/projects/nsis/files/NSIS%203/3.10/nsis-3.10.zip/download"
            $portableZip = Join-Path $env:RUNNER_TEMP "nsis-3.10.zip"
            $portableDir = Join-Path $env:RUNNER_TEMP "nsis-3.10"

            Invoke-WebRequest -Uri $portableUrl -OutFile $portableZip
            Expand-Archive -LiteralPath $portableZip -DestinationPath $portableDir -Force

            $portableHit = Get-ChildItem $portableDir -Filter makensis.exe -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName

            if ($portableHit -and (Test-Path $portableHit)) {
              $makensis = $portableHit
            } else {
              Write-Error "Unable to locate makensis.exe after NSIS install and portable fallback."
              exit 1
            }
          }

          & $makensis "/V3" "/DVERSION=$env:VERSION" "replaced\pkg_win.nsi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: dist/*.exe

  build-macos:
    if: ${{ needs.prepare.outputs.target == 'mac' || needs.prepare.outputs.target == 'both' || needs.prepare.outputs.target == 'all' }}
    needs: [prepare]
    runs-on: macos-14
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VER }}

      - name: Install dependencies from Pipfile
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[package]"
          pip install setuptools-scm

      - name: Build app with PyInstaller
        run: pyinstaller BlackboardSync.spec --noconfirm --clean

      - name: Package DMG (unsigned)
        shell: bash
        run: |
          APP_PATH="$(ls -d dist/*.app | head -n1)"
          APP_NAME="$(basename "$APP_PATH" .app)"
          mkdir -p dist/bbsync_dmg
          ln -s /Applications dist/bbsync_dmg/Applications
          cp -R "$APP_PATH" dist/bbsync_dmg/
          hdiutil create -volname "$APP_NAME" -srcfolder dist/bbsync_dmg -ov -format UDZO "dist/${APP_NAME}-${VERSION}-arm64.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: dist/*.dmg

  build-linux:
    if: ${{ needs.prepare.outputs.target == 'linux' || needs.prepare.outputs.target == 'all' }}
    needs: [prepare]
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VER }}

      - name: Install Linux runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libxcb-cursor0 libxkbcommon-x11-0 libnss3 libasound2 xdg-utils \
            libglib2.0-0 libfontconfig1 libfreetype6 libdbus-1-3 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1 \
            libxcb-keysyms1 libxcb-shape0 libxcb-icccm4 xvfb xauth

      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[package,test]"
          pip install jinja2 GitPython setuptools-scm

      - name: Test MCP transport
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q tests/test_mcp_server.py

      - name: Build app with PyInstaller
        run: pyinstaller BlackboardSync.spec --noconfirm --clean

      - name: Self-test packaged Linux application
        env:
          QTWEBENGINE_DISABLE_SANDBOX: "1"
        run: xvfb-run --auto-servernum dist/BlackboardSync/BlackboardSync --self-test

      - name: Render Linux desktop metadata
        run: python packaging/replace.py "$VERSION"

      - name: Assemble user installer
        shell: bash
        run: |
          PACKAGE_DIR="dist/BlackboardSync-${VERSION}-linux-x86_64"
          mkdir -p "$PACKAGE_DIR"
          cp -R dist/BlackboardSync "$PACKAGE_DIR/BlackboardSync"
          cp replaced/app.bbsync.BlackboardSync.desktop "$PACKAGE_DIR/"
          cp packaging/linux/icon.svg "$PACKAGE_DIR/app.bbsync.BlackboardSync.svg"
          cp packaging/linux/install.sh packaging/linux/uninstall.sh "$PACKAGE_DIR/"
          cp packaging/linux/blackboardsync-launcher "$PACKAGE_DIR/"
          cp packaging/linux/README-LINUX.md "$PACKAGE_DIR/README.md"
          chmod +x "$PACKAGE_DIR/install.sh" "$PACKAGE_DIR/uninstall.sh" "$PACKAGE_DIR/blackboardsync-launcher"
          tar -C dist -czf "dist/BlackboardSync-${VERSION}-linux-x86_64.tar.gz" \
            "BlackboardSync-${VERSION}-linux-x86_64"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: dist/*-linux-x86_64.tar.gz

  verify-arch:
    if: ${{ needs.prepare.outputs.target == 'linux' || needs.prepare.outputs.target == 'all' }}
    needs: [prepare, build-linux]
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Install runtime libraries
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            python nss alsa-lib xdg-utils glib2 fontconfig freetype2 dbus \
            libxcomposite libxdamage libxrandr libxtst libxkbcommon-x11 \
            libxcb xcb-util-keysyms xcb-util-wm xorg-server-xvfb mesa tar gzip

      - uses: actions/download-artifact@v4
        with:
          name: desktop-linux
          path: dist

      - name: Extract package
        run: tar -C dist -xzf dist/BlackboardSync-${VERSION}-linux-x86_64.tar.gz

      - name: Self-test packaged binary on Arch
        env:
          QTWEBENGINE_DISABLE_SANDBOX: "1"
        run: |
          BIN="dist/BlackboardSync-${VERSION}-linux-x86_64/BlackboardSync/BlackboardSync"
          xvfb-run --auto-servernum "$BIN" --self-test

      - name: Verify installer runs on Arch
        run: |
          export HOME=/root
          dist/BlackboardSync-${VERSION}-linux-x86_64/install.sh --no-autostart
          test -x "$HOME/.local/bin/blackboardsync"

  release:
    needs: [prepare, build-windows, build-macos, build-linux, verify-arch]
    if: ${{ always() && needs.verify-arch.result != 'failure' && (needs.build-windows.result == 'success' || needs.build-macos.result == 'success' || needs.build-linux.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: BlackboardSync ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          files: |
            ./*.exe
            ./*.dmg
            ./*-linux-x86_64.tar.gz
