name: Attach Extension Assets

on:
  workflow_call:
    inputs:
      tag_name:
        description: "Existing desktop release tag (example: 0.19.0)"
        required: true
        type: string
  push:
    tags:
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing desktop release tag (example: 0.19.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_call" ]; then
            echo "tag=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set Firefox-compatible extension version
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          tag = "${{ steps.vars.outputs.tag }}"
          tag = tag[1:] if tag.startswith("v") else tag
          numbers = re.findall(r"\d+", tag)
          if not numbers:
            numbers = ["0", "1", "0"]
          while len(numbers) < 3:
            numbers.append("0")
          version = ".".join(numbers[:4])

          path = Path("extension/manifest.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          manifest["version"] = version
          path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(f"manifest version set to {version}")
          PY

      - name: Package Chrome zip and Firefox xpi
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          cd extension
          zip -r "../blackboardsync-extension-chrome-${TAG}.zip" .
          zip -r "../blackboardsync-extension-firefox-${TAG}.xpi" .

      - name: Upload extension assets to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          prerelease: ${{ contains(steps.vars.outputs.tag, '-') }}
          files: |
            blackboardsync-extension-chrome-*.zip
            blackboardsync-extension-firefox-*.xpi
