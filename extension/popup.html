<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BlackboardSync</title>
  <style>
    body {
      font-family: Segoe UI, Arial, sans-serif;
      margin: 12px;
      min-width: 300px;
      color: #111;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 8px 0;
    }
    p {
      margin: 0 0 10px 0;
      color: #444;
      line-height: 1.4;
    }
    button {
      width: 100%;
      border: 1px solid #0b57d0;
      background: #0b57d0;
      color: #fff;
      border-radius: 8px;
      padding: 10px 12px;
      cursor: pointer;
      font-weight: 600;
    }
    button:disabled {
      opacity: 0.6;
      cursor: default;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #333;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>BlackboardSync</h1>
  <p>Download resources found on the current Blackboard page.</p>
  <button id="download-current">Download Current Page Resources</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
