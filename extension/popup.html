<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BlackboardSync</title>
  <style>
    :root {
      --bg: #f7f8fb;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --primary: #0b57d0;
      --border: #dbe2f0;
    }
    body {
      margin: 0;
      padding: 12px;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
      min-width: 420px;
      max-width: 460px;
    }
    h1 {
      margin: 0 0 6px 0;
      font-size: 18px;
    }
    .muted {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 10px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    input[type="text"] {
      flex: 1;
      min-width: 160px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
    }
    button {
      border: 1px solid var(--primary);
      background: var(--primary);
      color: #fff;
      border-radius: 8px;
      padding: 8px 10px;
      cursor: pointer;
      font-weight: 600;
    }
    button.secondary {
      background: #fff;
      color: var(--primary);
    }
    #course-list {
      max-height: 280px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      padding: 8px;
    }
    .term {
      margin: 10px 0 4px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
    }
    .course-item {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      padding: 6px;
      border-radius: 8px;
    }
    .course-item:hover {
      background: #f5f8ff;
    }
    .course-name {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.25;
    }
    .course-meta {
      font-size: 11px;
      color: var(--muted);
    }
    #status {
      margin-top: 8px;
      font-size: 12px;
      white-space: pre-wrap;
      color: #0b1f44;
    }
  </style>
</head>
<body>
  <h1>BlackboardSync Extension</h1>
  <div class="muted">Course selector + presets + incremental + ZIP per course</div>

  <div class="card">
    <div class="row">
      <input id="search" type="text" placeholder="Search courses..." />
      <label><input id="show-active" type="checkbox" checked /> Active</label>
      <label><input id="show-past" type="checkbox" checked /> Past</label>
    </div>
    <div class="row" style="margin-top:8px;">
      <button id="select-all" class="secondary">Select all</button>
      <button id="clear-all" class="secondary">Clear</button>
      <button id="open-settings" class="secondary">Settings</button>
    </div>
  </div>

  <div id="course-list" class="card"></div>

  <div class="card">
    <div id="settings-summary" class="muted"></div>
    <button id="download-selected">Download selected courses</button>
    <div id="status"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
